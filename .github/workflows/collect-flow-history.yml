name: Collect BONER boardroom data

on:
  schedule:
    # 17:07 UTC daily. Public endpoints enforce their own budget and holder cooldown.
    - cron: '7 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boner-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture 24-hour cohort flows and top 40 holders
        env:
          BOARDROOM_URL: ${{ vars.BOARDROOM_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.request
          base = os.environ['BOARDROOM_URL'] or ('https://meridian-buildathon.vercel.app' if os.environ['REPOSITORY'] == 'trunghieud/Meridian_Buildathon' else '')
          if not base:
              print('Set the BOARDROOM_URL repository variable to collect from your fork.')
              raise SystemExit(0)
          stamp = str(int(datetime.datetime.now(datetime.timezone.utc).timestamp()))
          for route in ('/api/meeting?period=1d&collection=' + stamp, '/api/top-holders'):
              with urllib.request.urlopen(base + route, timeout=40) as response:
                  data = json.load(response)
              if route.startswith('/api/meeting'):
                  if data.get('source') != 'api' or len(data.get('cohorts', [])) != 4:
                      raise RuntimeError('Four live cohort measurements were not returned: ' + str(data.get('warning')))
                  print(json.dumps({'route': 'meeting', 'asOf': data['asOf'],
                                    'cohorts': {c['id']: c['flow'] for c in data['cohorts']}}))
              else:
                  snapshot = data.get('snapshot')
                  if not snapshot or not 1 <= snapshot.get('count', 0) <= 40:
                      raise RuntimeError('Top holder observation unavailable: ' + str(data.get('warning')))
                  print(json.dumps({'route': 'top-holders', 'asOf': snapshot['asOf'],
                                    'count': snapshot['count'], 'totalTokens': snapshot['totalTokens'],
                                    'change24h': snapshot['change24h']}))
          PY
