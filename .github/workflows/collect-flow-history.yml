name: Collect BONER flow history

on:
  schedule:
    # An accepted run collects for several hours even if later scheduled runs are dropped.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boner-flow-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Capture cohort trends until the campaign ends or the call cap is reached
        env:
          BOARDROOM_URL: https://meridian-buildathon.vercel.app
        run: |
          python -u - <<'PY'
          import datetime, json, os, time, urllib.error, urllib.request

          utc = datetime.timezone.utc
          cutoff = datetime.datetime(2026, 9, 27, 23, 59, tzinfo=utc)
          end = min(cutoff, datetime.datetime.now(utc) + datetime.timedelta(hours=5))
          consecutive_errors = 0
          tick = 0
          while datetime.datetime.now(utc) < end:
              periods = ['1h']
              if tick % 2 == 0:
                  periods.append('1d')
              if tick % 5 == 0:
                  periods.append('7d')
              for period in periods:
                  if datetime.datetime.now(utc) >= cutoff:
                      break
                  url = os.environ['BOARDROOM_URL'] + '/api/meeting?period=' + period
                  request = urllib.request.Request(url, headers={'User-Agent': 'Meridian-Buildathon-Collector/1.0'})
                  try:
                      with urllib.request.urlopen(request, timeout=35) as response:
                          meeting = json.load(response)
                      warning = meeting.get('warning') or ''
                      print(json.dumps({'at': datetime.datetime.now(utc).isoformat(), 'period': period,
                                        'source': meeting.get('source'), 'asOf': meeting.get('asOf'),
                                        'warning': warning}), flush=True)
                      if meeting.get('source') == 'api':
                          consecutive_errors = 0
                      elif 'budget has been reached' in warning:
                          print('Atomic Redis call budget reached. Stopping.', flush=True)
                          raise SystemExit(0)
                      else:
                          consecutive_errors += 1
                  except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                      consecutive_errors += 1
                      print('Collection error: ' + str(exc), flush=True)
                  if consecutive_errors >= 5:
                      raise RuntimeError('Five consecutive observations failed; inspect deployment and Nansen balance.')
                  time.sleep(1)
              tick += 1
              remaining = (end - datetime.datetime.now(utc)).total_seconds()
              if remaining > 0:
                  time.sleep(min(120, remaining))
          print('Collection window ended.', flush=True)
          PY
