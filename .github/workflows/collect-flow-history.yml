name: Collect BONER boardroom data

on:
  schedule:
    # Eastern local time; automatically follows daylight saving time.
    - cron: '0 6,18 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boner-daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture cohort flows, top 40 balances, and total holder count
        env:
          BOARDROOM_URL: ${{ vars.BOARDROOM_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.request
          from zoneinfo import ZoneInfo
          base = os.environ['BOARDROOM_URL'] or ('https://meridian-buildathon.vercel.app' if os.environ['REPOSITORY'] == 'trunghieud/Meridian_Buildathon' else '')
          if not base:
              print('Set the BOARDROOM_URL repository variable to collect from your fork.')
              raise SystemExit(0)
          stamp = str(int(datetime.datetime.now(datetime.timezone.utc).timestamp()))
          eastern = datetime.datetime.now(ZoneInfo('America/New_York'))
          slot_start = eastern.replace(hour=6 if 6 <= eastern.hour < 18 else 18, minute=0, second=0, microsecond=0)
          if eastern.hour < 6:
              slot_start -= datetime.timedelta(days=1)
          failures = []
          for route in ('/api/meeting?period=1d&collection=' + stamp, '/api/top-holders', '/api/holder-count'):
              try:
                  with urllib.request.urlopen(base + route, timeout=40) as response:
                      data = json.load(response)
                  if route.startswith('/api/meeting'):
                      if data.get('source') != 'api' or len(data.get('cohorts', [])) != 4:
                          raise RuntimeError('Four live cohort measurements were not returned: ' + str(data.get('warning')))
                      print(json.dumps({'route': 'meeting', 'asOf': data['asOf'],
                                        'cohorts': {c['id']: c['flow'] for c in data['cohorts']}}))
                  elif route == '/api/top-holders':
                      snapshot = data.get('snapshot')
                      if data.get('warning') or not snapshot or datetime.datetime.fromisoformat(snapshot['asOf'].replace('Z', '+00:00')) < slot_start:
                          raise RuntimeError('Current collection slot unavailable: ' + str(data.get('warning')))
                      if not snapshot or not 1 <= snapshot.get('count', 0) <= 40:
                          raise RuntimeError('Top holder observation unavailable: ' + str(data.get('warning')))
                      print(json.dumps({'route': 'top-holders', 'asOf': snapshot['asOf'],
                                        'count': snapshot['count'], 'totalTokens': snapshot['totalTokens'],
                                        'change24h': snapshot['change24h']}))
                  else:
                      snapshot = data.get('snapshot')
                      if data.get('warning') or not snapshot or datetime.datetime.fromisoformat(snapshot['asOf'].replace('Z', '+00:00')) < slot_start:
                          raise RuntimeError('Current collection slot unavailable: ' + str(data.get('warning')))
                      if not snapshot or not isinstance(snapshot.get('totalHolders'), int):
                          raise RuntimeError('Total holder count unavailable: ' + str(data.get('warning')))
                      print(json.dumps({'route': 'holder-count', 'asOf': snapshot['asOf'],
                                        'totalHolders': snapshot['totalHolders']}))
              except Exception as error:
                  failures.append(route.split('?')[0] + ': ' + str(error))
          if failures:
              raise RuntimeError('; '.join(failures))
          PY
